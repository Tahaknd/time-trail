name: TimeTrail
options:
  bundleIdPrefix: com.timetrail
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"

settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ZB2L72NPRS
    CODE_SIGN_STYLE: Automatic

targets:
  TimeTrail:
    type: application
    platform: macOS
    sources:
      - path: TimeTrail
      - path: Shared
    info:
      path: TimeTrail/Info.plist
      properties:
        CFBundleDisplayName: TimeTrail
        CFBundleIdentifier: com.timetrail.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetrail.app
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TimeTrail/TimeTrail.entitlements
    dependencies:
      - package: GRDB
      - target: TimeTrailWidgetExtension
        embed: true

  TimeTrailWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TimeTrailWidget
      - path: Shared
    info:
      path: TimeTrailWidget/Info.plist
      properties:
        CFBundleDisplayName: TimeTrail Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: TimeTrailWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.timetrail.app.widget
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: TimeTrailWidget/TimeTrailWidget.entitlements
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false

  TimeTrailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TimeTrailTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetrail.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TimeTrail.app/Contents/MacOS/TimeTrail"
        BUNDLE_LOADER: "$(TEST_HOST)"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TimeTrail
        embed: false
      - package: GRDB
