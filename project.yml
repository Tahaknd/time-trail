name: TimeTrail
options:
  bundleIdPrefix: com.timetrail
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"

settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  TimeTrail:
    type: application
    platform: macOS
    sources:
      - path: TimeTrail
    info:
      path: TimeTrail/Info.plist
      properties:
        CFBundleDisplayName: TimeTrail
        CFBundleIdentifier: com.timetrail.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetrail.app
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: GRDB

  TimeTrailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TimeTrailTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetrail.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TimeTrail.app/Contents/MacOS/TimeTrail"
        BUNDLE_LOADER: "$(TEST_HOST)"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TimeTrail
        embed: false
      - package: GRDB
